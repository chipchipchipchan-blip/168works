name: Verify 168works

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 0 * * 1'

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Security and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          check-latest: true
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Check toolchain security baseline
        run: npm run security:check
      - name: Audit all dependencies
        run: npm audit --audit-level=moderate
      - name: Test publication safeguards
        run: npm run test:security
      - name: Typecheck, build and verify published files
        run: npm run build
